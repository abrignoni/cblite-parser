name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions the LEAPP runtime-contract CI runs, so a copy vendored into the
        # cores is proven on every interpreter those tools support.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A skipped test looks like a passing one in the summary, so any skip fails the job.
      - name: Run the tests
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-output.txt
          if grep -qi "skipped" test-output.txt; then
            echo "::error::a test was skipped; every test must run on every version"
            exit 1
          fi

      - name: Install the package and run the console script
        run: |
          python -m pip install .
          cblite-parser --help
