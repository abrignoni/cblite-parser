[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cblite-parser"
version = "1.0.0"
description = "Read-only reader for Couchbase Lite databases and Fleece documents, for digital forensics"
# The reader has no dependencies, so it can be vendored as one file.
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alexis Brignoni" }]

[project.urls]
Homepage = "https://github.com/abrignoni/cblite-parser"

[project.scripts]
cblite-parser = "cblite_parser.__main__:main"

[tool.setuptools]
packages = ["cblite_parser"]
